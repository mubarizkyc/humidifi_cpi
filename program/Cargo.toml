[package]
name = "humidifi_cpi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
bytemuck = { version = "1.23.0", features = ["derive"] }
arrayvec = { version = "0.7", default-features = false }
pinocchio = {version="0.9.2",features=["std"]}
pinocchio-system = "0.3.0"
pinocchio-pubkey = "0.3.0"
solana-msg = "3.0.0"
tokio = "1.48.0"



[dev-dependencies]
litesvm = "0.8.2"
solana-client = "3.0.0"
spl-associated-token-account = {version="8.0.0", features = ["no-entrypoint"] }
spl-token = "9.0.0"
solana-sdk = "3.0.0"
[features]
no-entrypoint = []
std = []
test-default = ["no-entrypoint", "std"]
[[test]]
name = "main"
